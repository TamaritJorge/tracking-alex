<!-- Tracking Álex · icono de app y favicon
     El mismo trazo dentro de una pastilla morada. Tiene fondo propio, así que
     se ve igual sobre cualquier cosa: pestaña clara, pantalla de inicio oscura
     o un fondo de escritorio cualquiera.

     Dentro va BLANCO macizo, no el degradado de la marca suelta: degradado
     sobre degradado se emborrona en cuanto baja de 32 px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
     width="100" height="100" role="img" aria-label="Tracking Álex">
  <title>Tracking Álex</title>
  <defs>
    <linearGradient id="ta-p" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="26" fill="url(#ta-p)"/>
  <path d="M30 74 L50 40 L70 74" fill="none" stroke="#fff" stroke-width="10.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M43 30 L61 19" fill="none" stroke="#fff" stroke-width="7.5"
        stroke-linecap="round"/>
</svg>
